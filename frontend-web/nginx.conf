server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz { access_log off; return 200 "ok"; }

  # Static assets có hash trong tên file: cache lâu
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback: route phía client do React Router xử lý
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
# /api và /ws do Spring Cloud Gateway / Ingress Kubernetes định tuyến, không proxy ở đây.
