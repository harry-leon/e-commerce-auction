# Chỉ log path/status, bỏ query và Referer có thể chứa chữ ký VNPAY hoặc token từ URL return.
log_format nexus_path '$remote_addr $request_method $uri $status $body_bytes_sent';
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  access_log /dev/stdout nexus_path;

  # Docker DNS cập nhật địa chỉ service sau khi container được tạo lại; cache tối đa 5 giây.
  # Không giữ IP cũ suốt vòng đời nginx vì IP đó có thể được cấp lại cho service khác.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 5s;

  location = /healthz { access_log off; return 200 "ok"; }

  # IPN chuyển nguyên query để backend xác minh; lỗi upstream không ghi request URI chứa hash vào error log.
  # HTTP status vẫn được ghi bằng nexus_path để theo dõi lỗi callback mà không lộ payload.
  location = /api/v1/payments/vnpay/ipn {
    error_log /dev/null;
    set $gateway_upstream api-gateway:8080;
    proxy_pass http://$gateway_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Static assets co hash trong ten file: cache lau
  # Giữ nguyên đường dẫn /api/... khi proxy tới Gateway; browser dùng cùng origin nên không cần gọi service trực tiếp.
  location /api/ {
    # Biến buộc proxy phân giải qua resolver khi chạy; không thêm URI để giữ nguyên path/query API và IPN.
    set $gateway_upstream api-gateway:8080;
    proxy_pass http://$gateway_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Giữ hai endpoint STOMP qua Gateway; chuyển nguyên Origin/cookie, không mở proxy cho đường dẫn WS tùy ý.
  location ~ ^/ws/(auctions|notifications)$ {
    set $gateway_upstream api-gateway:8080;
    proxy_pass http://$gateway_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  # SPA fallback: route phia client do React Router / SPA xu ly
  # Cam cache index.html de browser luon lay ban bundle moi nhat sau deploy
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }
}
