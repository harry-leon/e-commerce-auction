# Chạy toàn bộ hệ thống: cp .env.example .env && docker compose up --build
#   FE:      http://localhost:3000
#   Gateway: http://localhost:8080  (API: /api/v1/...)
#   Kèm Redis + Kafka: docker compose --profile full up --build
name: nexus

x-service: &service
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-nexus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexus}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-nexus} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-service:
    <<: *service
    build: ./backend/user-service
    environment:
      SERVICE_NAME: user-service
      DB_URL: jdbc:postgresql://postgres:5432/nexus_user
    ports:
      - "8081:8080"

  catalog-service:
    <<: *service
    build: ./backend/catalog-service
    environment:
      SERVICE_NAME: catalog-service
      DB_URL: jdbc:postgresql://postgres:5432/nexus_catalog
    ports:
      - "8082:8080"

  commerce-service:
    <<: *service
    build: ./backend/commerce-service
    environment:
      SERVICE_NAME: commerce-service
      DB_URL: jdbc:postgresql://postgres:5432/nexus_commerce
    ports:
      - "8083:8080"

  auction-service:
    <<: *service
    build: ./backend/auction-service
    environment:
      SERVICE_NAME: auction-service
      DB_URL: jdbc:postgresql://postgres:5432/nexus_auction
    ports:
      - "8084:8080"

  fulfillment-service:
    <<: *service
    build: ./backend/fulfillment-service
    environment:
      SERVICE_NAME: fulfillment-service
      DB_URL: jdbc:postgresql://postgres:5432/nexus_fulfillment
    ports:
      - "8085:8080"

  notification-service:
    <<: *service
    build: ./backend/notification-service
    environment:
      SERVICE_NAME: notification-service
      DB_URL: jdbc:postgresql://postgres:5432/nexus_notification
    ports:
      - "8086:8080"

  api-gateway:
    build: ./backend/api-gateway
    environment:
      USER_SERVICE_URL: http://user-service:8080
      CATALOG_SERVICE_URL: http://catalog-service:8080
      COMMERCE_SERVICE_URL: http://commerce-service:8080
      AUCTION_SERVICE_URL: http://auction-service:8080
      FULFILLMENT_SERVICE_URL: http://fulfillment-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - catalog-service
      - commerce-service
      - auction-service
      - fulfillment-service
      - notification-service

  web:
    build: ./frontend-web   # cần frontend-web/package-lock.json (chạy `npm install` một lần)
    ports:
      - "3000:8080"

  # ---- Hạ tầng dùng khi service cần (profile "full") ----
  redis:
    image: redis:7-alpine
    profiles: [full]
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.8.0
    profiles: [full]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

volumes:
  pgdata:
