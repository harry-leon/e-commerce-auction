# Chạy toàn bộ hệ thống: cp .env.example .env && docker compose up --build
#   FE:      http://localhost:3000
#   Gateway: http://localhost:8080  (API: /api/v1/...)
#   Kèm Redis + Kafka: docker compose --profile full up --build
name: nexus

# Luồng khởi động: PostgreSQL + Eureka + Config Server → backend → Gateway → web.
# Healthcheck TCP chỉ xác nhận cổng đã mở; script smoke còn chờ registry Eureka truyền tới Gateway.
x-service: &service
  env_file: .env
  healthcheck:
    test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
    interval: 5s
    timeout: 3s
    start_period: 30s
    retries: 30
  # Tách tài khoản PostgreSQL local khỏi DB_* có thể đang dùng cho database từ xa trong .env.
  environment: &cloud-env
    DB_USERNAME: ${LOCAL_DB_USERNAME:-nexus}
    DB_PASSWORD: ${LOCAL_DB_PASSWORD:-nexus}
    EUREKA_ENABLED: "true"
    EUREKA_URL: http://discovery-server:8761/eureka/
    CONFIG_SERVER_URL: http://config-server:8888

  depends_on:
    discovery-server:
      condition: service_healthy
    config-server:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  discovery-server:
    build: ./backend/discovery-server
    ports: ["8761:8761"]
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8761"]
      interval: 5s
      timeout: 3s
      retries: 30
  config-server:
    build: ./backend/config-server
    ports: ["8888:8888"]
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8888"]
      interval: 5s
      timeout: 3s
      retries: 30
  # SMTP local nhận thư reset thật; mở cổng 8025 để đọc thư, không gửi ra hộp thư Internet.
  mailpit:
    image: axllent/mailpit:v1.24.2
    ports: ["8025:8025", "1025:1025"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${LOCAL_DB_USERNAME:-nexus}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-nexus}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USERNAME:-nexus} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/nexus_keycloak
      KC_DB_USERNAME: ${LOCAL_DB_USERNAME:-nexus}
      KC_DB_PASSWORD: ${LOCAL_DB_PASSWORD:-nexus}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    <<: *service
    build: ./backend/user-service
    environment:
      <<: *cloud-env
      SMTP_HOST: mailpit
      FRONTEND_URL: http://localhost:3000
      SERVICE_NAME: user-service
      DB_URL: jdbc:postgresql://postgres:5432/nexus_user
    ports:
      - "8081:8080"

  catalog-service:
    <<: *service
    build: ./backend/catalog-service
    environment:
      <<: *cloud-env
      SERVICE_NAME: catalog-service
      DB_URL: jdbc:postgresql://postgres:5432/nexus_catalog
    ports:
      - "8082:8080"

  commerce-service:
    <<: *service
    build: ./backend/commerce-service
    environment:
      <<: *cloud-env
      SERVICE_NAME: commerce-service
      DB_URL: jdbc:postgresql://postgres:5432/nexus_commerce
    ports:
      - "8083:8080"

  auction-service:
    <<: *service
    build: ./backend/auction-service
    environment:
      <<: *cloud-env
      SERVICE_NAME: auction-service
      DB_URL: jdbc:postgresql://postgres:5432/nexus_auction
    ports:
      - "8084:8080"

  fulfillment-service:
    <<: *service
    build: ./backend/fulfillment-service
    environment:
      <<: *cloud-env
      SERVICE_NAME: fulfillment-service
      DB_URL: jdbc:postgresql://postgres:5432/nexus_fulfillment
    ports:
      - "8085:8080"

  notification-service:
    <<: *service
    build: ./backend/notification-service
    environment:
      <<: *cloud-env
      SERVICE_NAME: notification-service
      DB_URL: jdbc:postgresql://postgres:5432/nexus_notification
    ports:
      - "8086:8080"

  reputation-service:
    <<: *service
    build: ./backend/reputation-service
    environment:
      <<: *cloud-env
      SERVICE_NAME: reputation-service
      DB_URL: jdbc:postgresql://postgres:5432/nexus_reputation
    ports:
      - "8087:8080"

  # Gateway tra registry Eureka qua các URI lb://... thay vì phụ thuộc IP cố định của container.
  api-gateway:
    build: ./backend/api-gateway
    environment:
      <<: *cloud-env
      USER_SERVICE_URL: lb://user-service
      CATALOG_SERVICE_URL: lb://catalog-service
      COMMERCE_SERVICE_URL: lb://commerce-service
      AUCTION_SERVICE_URL: lb://auction-service
      FULFILLMENT_SERVICE_URL: lb://fulfillment-service
      NOTIFICATION_SERVICE_URL: lb://notification-service
      REPUTATION_SERVICE_URL: lb://reputation-service
      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 30
    depends_on:
      user-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      commerce-service:
        condition: service_healthy
      auction-service:
        condition: service_healthy
      fulfillment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy

  # Chờ Gateway sẵn sàng trước khi nginx nạp upstream; tránh lỗi DNS upstream khi web khởi động quá sớm.
  web:
    depends_on:
      api-gateway:
        condition: service_healthy
    build: ./frontend-web   # cần frontend-web/package-lock.json (chạy `npm install` một lần)
    ports:
      - "3000:8080"

  # ---- Hạ tầng dùng khi service cần (profile "full") ----
  redis:
    image: redis:7-alpine
    profiles: [full]
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.8.0
    profiles: [full]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

volumes:
  pgdata:
