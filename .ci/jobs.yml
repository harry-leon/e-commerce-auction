      elif [ "$CI_COMMIT_BRANCH" = "develop" ] || [ "$CI_COMMIT_BRANCH" = "dev" ]; then
        docker tag "$CI_REGISTRY_IMAGE/frontend-web:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE/frontend-web:develop"
        docker push "$CI_REGISTRY_IMAGE/frontend-web:develop"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
      changes:
          - frontend-web/**/*
          - .gitlab-ci.yml
          - .ci/**/*
    - if: $CI_COMMIT_TAG
