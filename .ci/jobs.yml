  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
          - frontend-web/**/*
          - .gitlab-ci.yml
          - .ci/**/*
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
      changes:
          - frontend-web/**/*
          - .gitlab-ci.yml
          - .ci/**/*
    - if: $CI_COMMIT_TAG

