# FILE SINH SẴN theo mẫu. Mỗi thành phần có 2-3 job; chỉ chạy khi file của thành phần đó thay đổi
# (hoặc khi sửa CI, hoặc khi gắn tag). Thêm service mới: copy khối của một service và đổi tên.

# ===================== user-service =====================
user-service:lint:
  extends: .be-base
  stage: validate
  script:
    - cd backend/user-service && mvn $MAVEN_CLI_OPTS checkstyle:check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
          - backend/user-service/**/*
          - .gitlab-ci.yml
          - .ci/**/*
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
      changes:
          - backend/user-service/**/*
          - .gitlab-ci.yml
          - .ci/**/*
    - if: $CI_COMMIT_TAG

user-service:test:
  extends: .be-base
  stage: test
  script:
    - cd backend/user-service && mvn $MAVEN_CLI_OPTS verify   # JaCoCo: line coverage >= 70% (SRS 5.6)
    - |
      CSV="target/site/jacoco/jacoco.csv"
      [ -f "$CSV" ] || CSV="backend/user-service/target/site/jacoco/jacoco.csv"
      awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "Total coverage: %.1f%%\n", c/(m+c)*100}' "$CSV"
  coverage: '/Total coverage: (\d+\.\d+)%/'
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - backend/user-service/target/site/jacoco/
    reports:
      junit: backend/user-service/target/surefire-reports/TEST-*.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
          - backend/user-service/**/*
          - .gitlab-ci.yml
          - .ci/**/*
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
      changes:
          - backend/user-service/**/*
          - .gitlab-ci.yml
          - .ci/**/*
    - if: $CI_COMMIT_TAG

user-service:image:
  extends: .docker-base
  stage: package
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/user-service:$CI_COMMIT_SHORT_SHA" backend/user-service
    - docker push "$CI_REGISTRY_IMAGE/user-service:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$CI_REGISTRY_IMAGE/user-service:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE/user-service:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE/user-service:$CI_COMMIT_TAG"
      elif [ "$CI_COMMIT_BRANCH" = "develop" ] || [ "$CI_COMMIT_BRANCH" = "dev" ]; then
        docker tag "$CI_REGISTRY_IMAGE/user-service:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE/user-service:develop"
        docker push "$CI_REGISTRY_IMAGE/user-service:develop"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
      changes:
          - backend/user-service/**/*
          - .gitlab-ci.yml
          - .ci/**/*
    - if: $CI_COMMIT_TAG

