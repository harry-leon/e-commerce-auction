# CI monorepo: mỗi thành phần (service BE, gateway, FE) có job riêng, chỉ chạy khi thư mục của nó thay đổi.
# Job nằm trong .ci/jobs.yml; khối dùng chung nằm trong .ci/templates.yml.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

stages: [validate, test, package]

include:
  - local: .ci/templates.yml
  - local: .ci/jobs.yml

# Tiêu đề MR phải theo Conventional Commits (được squash thành commit trên develop)
mr-title-check:
  stage: validate
  image: alpine:3.20
  cache: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      if ! echo "$CI_MERGE_REQUEST_TITLE" | grep -Eq '^(feat|fix|docs|refactor|test|chore|ci|perf|build|revert)(\([a-z0-9-]+\))?!?: .+'; then
        echo "MR title must follow Conventional Commits, e.g. feat(auction): add anti-sniping"
        echo "Got: $CI_MERGE_REQUEST_TITLE"
        exit 1
      fi
