# Luồng cấu hình: môi trường/ứng dụng → thử lấy cấu hình chung từ Config Server.
# Import optional cho phép chạy từng service khi dev mà không bắt buộc dựng toàn bộ hạ tầng.
spring:
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  application:
    name: ${SERVICE_NAME:fulfillment-service}
  profiles:
    active: ${SYSTEM_ENV:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexus_fulfillment}
    username: ${DB_USERNAME:nexus}
    password: ${DB_PASSWORD:nexus}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema do Flyway quản lý
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Cho phép bỏ qua khoảng trống version khi kết hợp migration trên Supabase (đã có V5) và môi trường mới.
    out-of-order: true
    ignore-migration-patterns: "*:missing,*:future"

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      probes:
        enabled: true             # /actuator/health/liveness, /readiness cho Kubernetes
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  # Cấu hình dự phòng cục bộ cho fulfillment-service khi chưa kết nối Config Server
  fulfillment:
    default-warehouse-code: ${DEFAULT_WAREHOUSE_ID:WH_001}
    reservation-timeout-minutes: ${INVENTORY_RESERVATION_TIMEOUT_MINUTES:30}
    allow-oversell: ${ALLOW_OVERSELL:false}
    reservation-sweep-interval-ms: ${INVENTORY_RESERVATION_SWEEP_INTERVAL_MS:60000}
    anti-sniping-extension-minutes: ${ANTI_SNIPING_EXTENSION_MINUTES:5}
    auction-payment-deadline-minutes: ${AUCTION_PAYMENT_DEADLINE_MINUTES:1440}
    auction-min-duration-minutes: ${AUCTION_MIN_DURATION_MINUTES:60}
    auction-max-duration-hours: ${AUCTION_MAX_DURATION_HOURS:168}
    shipping:
      default-delivery-days: ${FULFILLMENT_DEFAULT_DELIVERY_DAYS:3}
      max-retry-attempts: ${FULFILLMENT_MAX_RETRY_ATTEMPTS:3}
      auto-confirm-days: ${FULFILLMENT_AUTO_CONFIRM_DAYS:7}
      supported-carriers: ${SUPPORTED_CARRIERS:GHN,GHTK}
      default-carrier: ${DEFAULT_CARRIER:GHN}
      free-shipping-threshold: ${FREE_SHIPPING_THRESHOLD:100}
      ghn:
        base-url: ${GHN_API_URL:https://dev-online-gateway.ghn.vn}
        token: ${GHN_API_TOKEN:}
        shop-id: ${GHN_SHOP_ID:}
        connect-timeout-ms: ${GHN_CONNECT_TIMEOUT_MS:5000}
        read-timeout-ms: ${GHN_READ_TIMEOUT_MS:5000}
      ghtk:
        base-url: ${GHTK_API_URL:https://services.giaohangtietkiem.vn}
        token: ${GHTK_API_TOKEN:}
        connect-timeout-ms: ${GHTK_CONNECT_TIMEOUT_MS:5000}
        read-timeout-ms: ${GHTK_READ_TIMEOUT_MS:5000}

# Trong Compose, service đăng ký địa chỉ để Gateway tra cứu bằng lb://<service-name>.
# Mặc định tắt discovery khi chạy độc lập; EUREKA_ENABLED và EUREKA_URL được Compose cấp.
eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
