spring:
  application:
    name: fulfillment-service
  datasource:
    url: jdbc:h2:mem:fulfillment_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

app:
  fulfillment:
    default-warehouse-code: WH_001
    reservation-timeout-minutes: 30
    allow-oversell: false
    anti-sniping-extension-minutes: 5
    auction-payment-deadline-minutes: 1440
    auction-min-duration-minutes: 60
    auction-max-duration-hours: 168
    reservation-scheduler:
      enabled: false
