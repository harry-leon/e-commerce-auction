# Profile dev dùng PostgreSQL local hoặc DB_URL được truyền vào, không mặc định kết nối database từ xa.
# Compose ghi đè tài khoản DB bằng LOCAL_DB_*; không ghi thông tin truy cập thật vào file này.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexus_catalog}
    username: ${DB_USERNAME:nexus}
    password: ${DB_PASSWORD:nexus}
logging:
  level:
    com.nexus: DEBUG
