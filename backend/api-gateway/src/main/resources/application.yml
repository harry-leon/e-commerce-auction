server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# Gateway là điểm vào API duy nhất (Single Point of Entry).
# Tiếp nhận login/refresh token để gọi Keycloak, xác thực JWT bằng JWKS, gắn header và forward tới microservices.
# Điều phối luồng đăng ký tài khoản (BFF): gọi Keycloak Admin API tạo credentials rồi gọi user-service tạo profile.
spring:
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # WebSocket dùng scheme ws riêng; CONNECT được xác thực tại Auction, không đặt JWT trong URL.
        - id: auction-websocket
          uri: ${AUCTION_WS_URL:ws://localhost:8084}
          predicates:
            - Path=/ws/auctions
            - Method=GET
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**,/api/v1/roles/**,/api/v1/ping,/api/v1/auth/forgot-password,/api/v1/auth/reset-password,/api/v1/auth/change-password
        - id: catalog-service
          uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/products/**,/api/v1/categories/**,/api/v1/pricing-rules/**
        - id: commerce-service
          uri: ${COMMERCE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/cart/**,/api/v1/checkout/**,/api/v1/orders/**,/api/v1/payments/**
        - id: auction-service
          uri: ${AUCTION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/auctions/**,/api/v1/bids/**
        - id: fulfillment-service
          uri: ${FULFILLMENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/inventory/**,/api/v1/warehouses/**,/api/v1/shipping/**,/api/v1/shipments/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/notifications/**,/api/v1/event-logs/**
        - id: reputation-service
          uri: ${REPUTATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/reputations/**

app:
  # Danh sách origin chính xác dùng cho HTTP CORS và WebSocket; không dùng wildcard với cookie.
  web:
    allowed-origins: ${WEB_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
  auth:
    # Mặc định HTTPS; chạy localhost HTTP phải đặt AUTH_COOKIE_SECURE=false.
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
  keycloak:
    token-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/nexus-realm/protocol/openid-connect/token
    jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/nexus-realm/protocol/openid-connect/certs
    client-id: ${KEYCLOAK_CLIENT_ID:nexus-web}
    base-url: ${KEYCLOAK_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:nexus-realm}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:nexus-admin-cli}
    # Secret lấy từ môi trường, khớp realm import; không có secret mặc định.
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/nexus-realm}
    # BFF dùng HTTP URL; không đưa lb:// vào WebClient thông thường.
    user-service-url: ${USER_PROFILE_URL:http://localhost:8081}

# Không bật trace HTTP/Gateway hoặc wiretap trên đường IPN: URL chứa chữ ký, header chứa cookie/service token.
logging:
  level:
    org.springframework.web: INFO
    org.springframework.cloud.gateway: INFO
    reactor.netty.http: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
