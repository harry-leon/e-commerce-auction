# Luồng cấu hình: môi trường/ứng dụng → thử lấy cấu hình chung từ Config Server.
# Import optional cho phép chạy từng service khi dev mà không bắt buộc dựng toàn bộ hạ tầng.
spring:
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  application:
    name: ${SERVICE_NAME:commerce-service}
  profiles:
    active: ${SYSTEM_ENV:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexus_commerce}
    username: ${DB_USERNAME:nexus}
    password: ${DB_PASSWORD:nexus}
  jpa:
    open-in-view: false
    # Timestamp trong ERD không có múi giờ; chuyển Instant qua JDBC bằng UTC để tránh lệch giờ theo máy chủ.
    properties:
      hibernate.jdbc.time_zone: UTC
    hibernate:
      ddl-auto: validate          # schema do Flyway quản lý
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# Credential merchant và service account chỉ lấy từ môi trường; COD không cần VNPAY nhưng vẫn cần identity gọi kho.
# Return URL là trang hiển thị; IPN URL /api/v1/payments/vnpay/ipn phải đăng ký riêng trên merchant VNPAY.
app:
  shipping:
    # Chỉ ghi WAITING_PARCEL sau tiền/kho; chưa có worker dispatch, không backfill khi bật và không gọi carrier.
    handoff-enabled: ${SHIPPING_HANDOFF_ENABLED:false}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  reputation:
    url: ${REPUTATION_SERVICE_URL:http://localhost:8087}
  auction:
    url: ${AUCTION_SERVICE_URL:http://localhost:8084}
  notification:
    # Service account riêng chỉ có NOTIFICATION_WRITER; gửi sau commit, không dùng JWT buyer.
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
    token-url: ${NOTIFICATION_TOKEN_URL:}
    client-id: ${NOTIFICATION_CLIENT_ID:}
    client-secret: ${NOTIFICATION_CLIENT_SECRET:}
  payment:
    auction:
      expiry-poll-ms: ${AUCTION_EXPIRY_POLL_MS:10000}
      reminder-poll-ms: ${AUCTION_REMINDER_POLL_MS:60000}
      reminder-before-minutes: ${AUCTION_REMINDER_BEFORE_MINUTES:120}
      timeout-poll-ms: ${AUCTION_TIMEOUT_POLL_MS:5000}
      timeout-penalty-score: ${PAYMENT_TIMEOUT_PENALTY_SCORE:10}
    vnpay:
      # Chỉ mở transport Merchant API khi đã xác minh quyền; không tự khởi động refund worker.
      merchant-api-enabled: ${VNPAY_MERCHANT_API_ENABLED:false}
      # Hai cổng độc lập, kèm approval theo từng refund; mặc định không có mutation provider.
      refund-worker-enabled: ${VNPAY_REFUND_WORKER_ENABLED:false}
      merchant-source-ip: ${VNPAY_MERCHANT_SOURCE_IP:}
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      return-url: ${VNPAY_RETURN_URL:}
    inventory:
      # Checkout và worker đều dùng client_credentials gọi kho; không chuyển tiếp hay lưu JWT buyer.
      token-url: ${PAYMENT_INVENTORY_TOKEN_URL:${KEYCLOAK_URL:http://localhost:8180}/realms/nexus-realm/protocol/openid-connect/token}
      client-id: ${PAYMENT_INVENTORY_CLIENT_ID:nexus-commerce-service}
      client-secret: ${PAYMENT_INVENTORY_CLIENT_SECRET:${COMMERCE_CLIENT_SECRET:}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    refresh:
      enabled: true
    health:
      # Probe công khai chỉ status; Admin mới thấy component/count backlog, không trả payload hoặc credential.
      show-components: when_authorized
      show-details: when_authorized
      roles: ADMIN
      probes:
        enabled: true             # /actuator/health/liveness, /readiness cho Kubernetes
  tracing:
    sampling:
      probability: 1.0

# DEBUG web/JDBC có thể in query IPN hoặc bind payment_url chứa hash; không ghi request body/token/chữ ký vào log.
logging:
  level:
    org.springframework.web: INFO
    org.springframework.jdbc.core: INFO
    org.hibernate.orm.jdbc.bind: "OFF"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Trong Compose, service đăng ký địa chỉ để Gateway tra cứu bằng lb://<service-name>.
# Mặc định tắt discovery khi chạy độc lập; EUREKA_ENABLED và EUREKA_URL được Compose cấp.
eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
