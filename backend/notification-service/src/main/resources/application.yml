# Luồng cấu hình: môi trường/ứng dụng → thử lấy cấu hình chung từ Config Server.
# Import optional cho phép chạy từng service khi dev mà không bắt buộc dựng toàn bộ hạ tầng.
spring:
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  application:
    name: ${SERVICE_NAME:notification-service}
  profiles:
    active: ${SYSTEM_ENV:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexus_notification}
    username: ${DB_USERNAME:nexus}
    password: ${DB_PASSWORD:nexus}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema do Flyway quản lý
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# Cấu hình kênh thông báo giao dịch (SRS §2.6 & §3.2.3)
notification:
  email-enabled: ${EMAIL_NOTIFICATION_ENABLED:true}
  retry-limit: ${NOTIFICATION_RETRY_LIMIT:3}
  transactional-mandatory: ${TRANSACTIONAL_NOTIFICATION_MANDATORY:true}
  sender-from: ${MAIL_FROM:no-reply@nexus.com}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true             # /actuator/health/liveness, /readiness cho Kubernetes
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Trong Compose, service đăng ký địa chỉ để Gateway tra cứu bằng lb://<service-name>.
# Mặc định tắt discovery khi chạy độc lập; EUREKA_ENABLED và EUREKA_URL được Compose cấp.
eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
