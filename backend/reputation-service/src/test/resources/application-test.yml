spring:
  application:
    name: reputation-service
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:reputation_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

eureka:
  client:
    enabled: false

app:
  reputation:
    payment-timeout-penalty-score: 10
