# Cấu hình reputation-service quản lý đánh giá, xử phạt và điểm uy tín
spring:
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  application:
    name: ${SERVICE_NAME:reputation-service}
  profiles:
    active: ${SYSTEM_ENV:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexus_reputation}
    username: ${DB_USERNAME:nexus}
    password: ${DB_PASSWORD:nexus}
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

# Tham số xử phạt uy tín và đánh giá theo SRS §2.6 & §3.5.3
app:
  reputation:
    payment-timeout-penalty-score: ${PAYMENT_TIMEOUT_PENALTY_SCORE:10}
    order-verification-enabled: ${ORDER_VERIFICATION_ENABLED:true}
    commerce-base-url: ${COMMERCE_SERVICE_URL:http://localhost:8083}

server:
  port: ${SERVER_PORT:8087}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
