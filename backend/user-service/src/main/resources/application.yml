# Luồng cấu hình: môi trường/ứng dụng → thử lấy cấu hình chung từ Config Server.
# Import optional cho phép chạy từng service khi dev mà không bắt buộc dựng toàn bộ hạ tầng.
spring:
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  application:
    name: ${SERVICE_NAME:user-service}
  profiles:
    active: ${SYSTEM_ENV:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexus_user}
    username: ${DB_USERNAME:nexus}
    password: ${DB_PASSWORD:nexus}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema do Flyway quản lý
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      probes:
        enabled: true             # /actuator/health/liveness, /readiness cho Kubernetes
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  # Audit thuộc event_logs của notification theo ERD; URL nội bộ được Compose ghi đè.
  notification:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
  # Keycloak là nguồn IAM; token admin chỉ dùng gọi API, không lưu credential trong DB profile.
  keycloak:
    base-url: ${KEYCLOAK_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:nexus-realm}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:nexus-admin-cli}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
    client-id: ${KEYCLOAK_CLIENT_ID:nexus-web}
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/nexus-realm}
    jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:nexus-realm}/protocol/openid-connect/certs
# Trong Compose, service đăng ký địa chỉ để Gateway tra cứu bằng lb://<service-name>.
# Mặc định tắt discovery khi chạy độc lập; EUREKA_ENABLED và EUREKA_URL được Compose cấp.
eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
