spring:
  application:
    name: ${SERVICE_NAME:user-service}
  profiles:
    active: ${SYSTEM_ENV:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexus_user}
    username: ${DB_USERNAME:nexus}
    password: ${DB_PASSWORD:nexus}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema do Flyway quản lý
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true             # /actuator/health/liveness, /readiness cho Kubernetes
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    # Bắt buộc >= 32 ký tự. KHÔNG commit secret thật; truyền qua biến môi trường / Secret Manager.
    jwt-secret: ${JWT_SECRET:nexus-default-dev-secret-key-must-be-32-characters-or-more}
    access-token-expiry-minutes: ${ACCESS_TOKEN_EXPIRY_MINUTES:60}
    refresh-token-expiry-days: ${REFRESH_TOKEN_EXPIRY_DAYS:7}
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    reset-password-expiry-minutes: ${RESET_PASSWORD_EXPIRY_MINUTES:15}
