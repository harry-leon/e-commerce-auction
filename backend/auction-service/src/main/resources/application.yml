# Luồng cấu hình: môi trường/ứng dụng -> thử lấy cấu hình chung từ Config Server.
# Import optional cho phép chạy từng service khi dev mà không bắt buộc dựng toàn bộ hạ tầng.
spring:
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  application:
    name: ${SERVICE_NAME:auction-service}
  profiles:
    active: ${SYSTEM_ENV:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexus_auction}
    username: ${DB_USERNAME:nexus}
    password: ${DB_PASSWORD:nexus}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema do Flyway quản lý
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      probes:
        enabled: true             # /actuator/health/liveness, /readiness cho Kubernetes
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  # Secret riêng của Auction, không dùng admin account hay role SELLER cho request nội bộ.
  service-auth:
    token-url: ${AUCTION_TOKEN_URL:${KEYCLOAK_URL:http://localhost:8180}/realms/nexus-realm/protocol/openid-connect/token}
    client-id: ${AUCTION_CLIENT_ID:nexus-auction-service}
    client-secret: ${AUCTION_CLIENT_SECRET:}
  # Phải khớp Gateway và origin trình duyệt; không cho wildcard khi handshake có cookie.
  web:
    allowed-origins: ${WEB_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
  # Cấu hình dự phòng cục bộ cho auction-service khi chưa kết nối Config Server
  auction:
    scheduler:
      enabled: ${AUCTION_SCHEDULER_ENABLED:true}
      opening-interval-ms: ${AUCTION_SCHEDULER_OPENING_INTERVAL_MS:5000}
      closing-interval-ms: ${AUCTION_SCHEDULER_CLOSING_INTERVAL_MS:10000}
      settlement-interval-ms: ${AUCTION_SCHEDULER_SETTLEMENT_INTERVAL_MS:10000}
      handover-interval-ms: ${AUCTION_SCHEDULER_HANDOVER_INTERVAL_MS:10000}
    bidding:
      min-increment: ${AUCTION_MIN_INCREMENT:1000}
      anti-sniping-seconds: ${AUCTION_ANTI_SNIPING_SECONDS:120}
      max-extension-count: ${AUCTION_MAX_EXTENSION_COUNT:10}
    rules:
      max-active-auctions-per-seller: ${AUCTION_MAX_ACTIVE_PER_SELLER:20}
      min-duration-seconds: ${AUCTION_MIN_DURATION_SECONDS:3600}
      max-duration-seconds: ${AUCTION_MAX_DURATION_SECONDS:604800}
      reputation-enforcement-enabled: ${FEATURE_REPUTATION_ENFORCEMENT:true}

# Trong Compose, service đăng ký địa chỉ để Gateway tra cứu bằng lb://<service-name>.
# Mặc định tắt discovery khi chạy độc lập; EUREKA_ENABLED và EUREKA_URL được Compose cấp.
# Cấu hình eureka.client.service-url.defaultZone để client kết nối đúng Eureka Server trong mạng Docker.
eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
